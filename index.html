<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  />

  <title>YouTubeプレイヤー</title>

  <link
    rel="apple-touch-icon"
    href="youtube-player-logo.png"
  />

  <link
    rel="icon"
    type="image/png"
    href="youtube-player-logo.png"
  />

  <link rel="stylesheet" href="style.css?v=6" />
</head>

<body>
  <main class="app">
    <div class="pageLayout">

      <section class="playerArea">
        <div class="videoWrapper">
          <iframe
            id="youtubePlayer"
            src=""
            title="YouTube動画プレイヤー"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>

          <p id="emptyMessage">
            リストから動画を選択してください
          </p>
        </div>

<div class="playingInfo">
  <p id="playingTitle">
    再生中の動画はありません
  </p>

  <button
    id="addToSetlistButton"
    class="secondaryButton"
    type="button"
    hidden
  >
    セットリストに追加
  </button>
</div>
      </section>

      <div class="rightColumn">

        <div
          class="tabButtons"
          role="tablist"
          aria-label="動画管理メニュー"
        >
          <button
            id="registerTabButton"
            class="tabButton"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="registerTabPanel"
          >
            動画登録
          </button>

          <button
            id="listTabButton"
            class="tabButton isActive"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="listTabPanel"
          >
            動画リスト
          </button>
        </div>

        <section
          id="registerTabPanel"
          class="tabPanel registerArea"
          role="tabpanel"
          aria-labelledby="registerTabButton"
          hidden
        >
          <label for="videoTitle">
            登録名
          </label>

          <input
            id="videoTitle"
            type="text"
            autocomplete="off"
          />

          <label for="videoYomi">
            よみがな
          </label>

          <input
            id="videoYomi"
            type="text"
            autocomplete="off"
          />

          <label for="youtubeUrl">
            YouTubeのURL
          </label>

          <input
            id="youtubeUrl"
            type="text"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
          />

          <button
            id="addButton"
            type="button"
          >
            リストに登録
          </button>

          <div class="playlistTransferActions">
  <button
    type="button"
    id="exportPlaylistButton"
  class="secondaryButton playlistTransferButton"
  >
    📤 プレイリストを書き出す
  </button>

  <button
    type="button"
    id="importPlaylistButton"
  class="secondaryButton playlistTransferButton"
  >
    📥 プレイリストを読み込む
  </button>

  <input
    id="importPlaylistInput"
    type="file"
    accept="application/json,.json"
    hidden
  />
</div>

          <p
            id="errorMessage"
            aria-live="polite"
          ></p>
        </section>

        <section
          id="listTabPanel"
          class="tabPanel listArea isActive"
          role="tabpanel"
          aria-labelledby="listTabButton"
        >
          <div class="listHeader">
            <h2>動画リスト</h2>

            <button
              id="sortButton"
              type="button"
            >
              五十音順
            </button>
          </div>

          <div id="videoList">
            <p class="emptyList">
              登録されている動画はありません
            </p>
          </div>
        </section>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="script.js?v=6"></script>
</body>
</html>
