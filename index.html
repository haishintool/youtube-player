<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  />

  <title>YouTubeプレイヤー</title>

  <link
    rel="apple-touch-icon"
    href="youtube-player-logo.png"
  />

  <link
    rel="icon"
    type="image/png"
    href="youtube-player-logo.png"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <div class="pageLayout">

      <section class="playerArea">
        <div class="videoWrapper">
          <iframe
            id="youtubePlayer"
            src=""
            title="YouTube動画プレイヤー"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>

          <p id="emptyMessage">
            リストから動画を選択してください
          </p>
        </div>

        <p id="playingTitle">
          再生中の動画はありません
        </p>
      </section>

      <div class="rightColumn">

        <section class="registerArea">
          <label for="videoTitle">
            登録名
          </label>

          <input
            id="videoTitle"
            type="text"
            autocomplete="off"
          />

          <label for="videoYomi">
            よみがな
          </label>

          <input
            id="videoYomi"
            type="text"
            autocomplete="off"
          />

          <label for="youtubeUrl">
            YouTubeのURL
          </label>

          <input
            id="youtubeUrl"
            type="text"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
          />

          <button
            id="addButton"
            type="button"
          >
            リストに登録
          </button>

          <p
            id="errorMessage"
            aria-live="polite"
          ></p>
        </section>

        <section class="listArea">
          <div class="listHeader">
            <h2>動画リスト</h2>

            <button
              id="sortButton"
              type="button"
            >
              五十音順
            </button>
          </div>

          <div id="videoList">
            <p class="emptyList">
              登録されている動画はありません
            </p>
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- ドラッグ＆ドロップ用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

  <!-- メインスクリプト -->
  <script src="script.js?v=5"></script>
</body>
</html>
